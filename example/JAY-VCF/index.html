<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在為您建立聯絡人...</title>
<style>
:root {
  --bg-color: #05050a;
  --primary-glow: #00f0ff;
  --secondary-glow: #7928ca;
  --accent-glow: #ff007f;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #14142b 0%, #080812 60%, var(--bg-color) 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

/* 華麗發光浮動卡片 */
.luxury-card {
  position: relative;
  width: 85%;
  max-width: 380px;
  background: rgba(20, 20, 35, 0.65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 45px 30px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
              0 0 40px rgba(121, 40, 202, 0.25),
              inset 0 0 20px rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* 炫彩光環包裝器 */
.loader-box {
  position: relative;
  width: 90px;
  height: 90px;
  margin: 0 auto 32px;
}

/* 多層次旋轉漸層光環 */
.ring {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 3px solid transparent;
}

.ring:nth-child(1) {
  border-top-color: var(--primary-glow);
  border-right-color: var(--primary-glow);
  animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
  filter: drop-shadow(0 0 8px var(--primary-glow));
}

.ring:nth-child(2) {
  width: 70px;
  height: 70px;
  top: 10px;
  left: 10px;
  border-bottom-color: var(--secondary-glow);
  border-left-color: var(--secondary-glow);
  animation: spinReverse 1s linear infinite;
  filter: drop-shadow(0 0 8px var(--secondary-glow));
}

.ring:nth-child(3) {
  width: 50px;
  height: 50px;
  top: 20px;
  left: 20px;
  border-top-color: var(--accent-glow);
  animation: spin 0.8s ease-in-out infinite;
  filter: drop-shadow(0 0 8px var(--accent-glow));
}

/* 中心脈衝核心 */
.core {
  position: absolute;
  top: 38px;
  left: 38px;
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 15px #fff, 0 0 25px var(--primary-glow);
  animation: pulse 1.5s ease-in-out infinite;
}

/* 質感流光標題文字 */
.title {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 1.2px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 60%, #ff79c6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  opacity: 0;
  animation: fadeInUp 0.7s ease 0.3s forwards;
}

/* 精緻副標題 */
.subtitle {
  font-size: 13px;
  color: #94a3b8;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeInUp 0.7s ease 0.5s forwards;
}

/* 動畫定義 */
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spinReverse {
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}

@keyframes pulse {
  0%, 100% { transform: scale(0.8); opacity: 0.6; }
  50% { transform: scale(1.3); opacity: 1; }
}

@keyframes cardEntrance {
  0% { opacity: 0; transform: translateY(30px) scale(0.9); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}
</style>
<script>
window.onload = function() {
  setTimeout(function(){
    // 自動指向對應的 VCF 檔案
    window.location.href = "JAY.vcf";
  }, 1100); // 延長至 1.1 秒讓使用者充分享受華麗動態
}
</script>
</head>
<body>
<div class="luxury-card">
  <div class="loader-box">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core"></div>
  </div>
  <div class="title">正在為您建立聯絡人</div>
  <div class="subtitle">Please Wait ...</div>
</div>
</body>
</html>
