<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王昱翔醫師 | 頂級商務數位名片</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #121212; --card-bg: #1E1E1E; --primary-color: #E0E0E0; --accent-color: #D4AF37; --text-main: #FFFFFF; --text-sub: #A0A0A0; --border-color: #333333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* NFC 掃描動畫 */
        #nfc-loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #nfc-loader.hidden { opacity: 0; visibility: hidden; }
        .nfc-waves { position: relative; width: 120px; height: 120px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; }
        .nfc-wave { position: absolute; border: 2px solid var(--accent-color); border-radius: 50%; animation: ripple 2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite; opacity: 0; }
        .nfc-wave:nth-child(1) { width: 40px; height: 40px; animation-delay: 0s; }
        .nfc-wave:nth-child(2) { width: 80px; height: 80px; animation-delay: 0.6s; }
        .nfc-wave:nth-child(3) { width: 120px; height: 120px; animation-delay: 1.2s; }
        .nfc-icon-center { position: relative; z-index: 2; font-size: 28px; color: #FFFFFF; background: linear-gradient(135deg, var(--accent-color), #FFFFFF); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); animation: float 2s ease-in-out infinite; }
        @keyframes ripple { 0% { transform: scale(0.5); opacity: 0; } 40% { opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .nfc-loading-text { font-size: 16px; font-weight: 500; color: var(--accent-color); letter-spacing: 4px; animation: pulseText 1.5s ease-in-out infinite; }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 高階商務主卡片 */
        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* 金屬光澤頂部飾條 */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color), #FFFFFF, var(--accent-color));
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
            letter-spacing: 1.5px;
        }

        .name-en {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* 企業資訊區塊 */
        .executive-corp-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .exec-company {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .exec-title {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 聯絡資訊條列 */
        .exec-contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }
        .exec-contact-item {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            text-align: left;
        }
        .exec-contact-item:hover {
            border-color: var(--accent-color);
            transform: translateX(3px);
        }
        .eci-icon {
            width: 36px; height: 36px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-color);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            margin-right: 14px;
            flex-shrink: 0;
        }
        .eci-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }
        .eci-label {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .eci-val {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .eci-arrow {
            color: var(--text-sub);
            font-size: 12px;
            opacity: 0.5;
        }

        /* 按鈕群組 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .exec-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .exec-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .exec-btn i {
            font-size: 18px;
            margin-right: 10px;
        }

        .exec-btn-vcf {
            background: linear-gradient(135deg, var(--accent-color), #E5C158);
            color: #121212;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: 700;
        }
        .exec-btn-call {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }
        .exec-btn-line {
            background-color: #06C755;
            color: #FFFFFF;
        }
        .exec-btn-fb {
            background-color: #1877F2;
            color: #FFFFFF;
        }
        .exec-btn-tk {
            background-color: #000000;
            color: #FFFFFF;
            border: 1px solid #333333;
        }
        /* WhatsApp 專屬按鈕樣式 */
        .exec-btn-whatsapp {
            background-color: #25D366;
            color: #FFFFFF;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: var(--text-sub);
            letter-spacing: 1px;
        }
    </style>
</head>
