<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAY | 數位名片</title>
    <!-- 引入字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --brand-bg: #E6D5C3; --drawer-bg: #FCFAF8; --card-inner-bg: #FFFFFF; --text-main: #5C4D3C; --text-sub: #96897A; --accent-color: #8B6F4E; --circle-bg: rgba(139,111,78,0.12); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }

        body {
            background-color: #EAEAEA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 手機模擬器外框 */
        .mobile-simulator {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: var(--brand-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* NFC 掃描動畫 */
        #nfc-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--brand-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #nfc-loader.hidden { opacity: 0; visibility: hidden; }
        .nfc-waves { position: relative; width: 120px; height: 120px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; }
        .nfc-wave { position: absolute; border: 2px solid var(--accent-color); border-radius: 50%; animation: ripple 2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite; opacity: 0; }
        .nfc-wave:nth-child(1) { width: 40px; height: 40px; animation-delay: 0s; }
        .nfc-wave:nth-child(2) { width: 80px; height: 80px; animation-delay: 0.6s; }
        .nfc-wave:nth-child(3) { width: 120px; height: 120px; animation-delay: 1.2s; }
        .nfc-icon-center { position: relative; z-index: 2; font-size: 28px; color: var(--brand-bg); background: var(--accent-color); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); animation: float 2s ease-in-out infinite; }
        @keyframes ripple { 0% { transform: scale(0.5); opacity: 0; } 40% { opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .nfc-loading-text { font-size: 16px; font-weight: 500; color: #FFFFFF; letter-spacing: 3px; animation: pulseText 1.5s ease-in-out infinite; }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* 頂部品牌區 */
        .header-zone {
            height: 32vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
        }
        .logo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto;

    border: 4px solid #fff;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

        /* 底部抽屜面板 */
        .drawer-zone {
            flex-grow: 1;
            background: var(--drawer-bg);
            border-radius: 35px 35px 0 0;
            padding: 30px 25px 40px 25px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 抽屜頂部小把手 */
        .drawer-handle {
            width: 40px;
            height: 5px;
            background: var(--text-sub);
            border-radius: 10px;
            opacity: 0.3;
            margin: -10px auto 25px auto;
        }

        /* 個人資訊 */
        .name {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        /* 💡 更新：獨立分行的公司與職稱 */
        .job-info-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 25px;
            text-align: center;
        }
        .corp-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: 1.5px;
        }
        .corp-title {
            font-size: 14px;
            color: var(--text-sub);
        }

        /* 快捷功能圈 */
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .qa-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.2s;
        }
        .qa-btn:hover { transform: translateY(-3px); }
        .qa-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--circle-bg);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .qa-btn span { font-size: 12px; font-weight: 500; }

        /* 系統級清單選單 */
        .action-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .list-item {
            display: flex;
            align-items: center;
            background: var(--card-inner-bg);
            padding: 12px 18px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .list-item:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        
        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-right: 16px;
            flex-shrink: 0;
        }
        
        /* 為每個社群設定專屬底色 */
        .ib-vcf { background: var(--accent-color); }
        .ib-web { background: #333333; }
        .ib-line { background: #06C755; }
        .ib-ig { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .ib-fb { background: #1877F2; }
        .ib-tk { background: #000000; }
        
        .li-text {
            flex-grow: 1;
            font-size: 15px;
            font-weight: 500;
        }
        .li-arrow {
            color: var(--text-sub);
            font-size: 14px;
            opacity: 0.6;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            opacity: 0.8;
        }
    </style>
</head>

</html>
